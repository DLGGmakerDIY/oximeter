[env:Watcher]
platform =  espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

monitor_filters =
    default
    time
; monitor_raw = yes
; board_upload.flash_size = 32MB
board_build.partitions = partitions_16MB.csv
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
; board_build.filesystem_image = buildfs.bin
board_build.filesystem = spiffs

; 排除 ref 和 arduino_ide_project 目录不被编译
build_src_filter =
    +<*>
    -<ref/>
    -<arduino_ide_project/>

upload_flags =
    --before
    default_reset
    --after
    hard_reset
    --chip
    esp32s3

build_flags =
    -std=gnu11
    -DCORE_DEBUG_LEVEL=2
    ; -DBOARD_HAS_PSRAM  ; 注释掉：硬件没有PSRAM或PSRAM配置不正确导致崩溃
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_SERIAL_EVENT_RUN_CORE=1
    ; Fix for GFX library ESP-IDF compatibility
    -DESP_LCD_RGB_PANEL_FRAME_TRANS_DONE_CB_T_DEFINED
    ; 增加 Arduino loop 任务栈大小
    ; -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; SPIFFS配置 - 增加页面大小以支持16MB分区（512字节页面支持最大28MB）
    ; -DCONFIG_SPIFFS_PAGE_SIZE=512
    -DCONFIG_SPIFFS_MAX_PARTITIONS=3
    ; 尝试使用FAT文件系统替代SPIFFS
    -DCONFIG_FATFS_MAX_LFN=255
    -DCONFIG_FATFS_API_ENCODING_UTF_8=1
    -DCONFIG_FATFS_FS_LOCK_RECURSIVE=1
    ; LVGL 基础配置
    -DLV_CONF_SKIP
    -DLV_CONF_INCLUDE_SIMPLE
    ; LVGL 颜色和内存
    -DLV_COLOR_DEPTH=16
    -DLV_MEM_SIZE=131072
    ; 启用需要的字体
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_48=1
    ; LVGL 其他配置
    -DLV_USE_LOG=0
    -DLV_TICK_CUSTOM=0

lib_deps =
    lvgl/lvgl@9.2.1
    adafruit/Adafruit NeoPixel@1.15.2
    https://github.com/schreibfaul1/ESP32-audioI2S@3.4.4
    https://github.com/sparkfun/SparkFun_MAX3010x_Sensor_Library